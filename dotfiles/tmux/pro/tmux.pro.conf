##### ─────────────────────────────────────────────
#####  Tmux Pro Profile
#####  Cross‑platform IDE‑style environment
##### ─────────────────────────────────────────────

# Prefix
set -g prefix C-a
unbind C-b
bind C-a send-prefix

# Secondary prefix (optional)
set -g prefix2 C-b

# Pane navigation (Vim style)
bind -n C-h select-pane -L
bind -n C-j select-pane -D
bind -n C-k select-pane -U
bind -n C-l select-pane -R

# Pane resizing
bind -n M-Left  resize-pane -L 5
bind -n M-Right resize-pane -R 5
bind -n M-Up    resize-pane -U 3
bind -n M-Down  resize-pane -D 3

# Mouse + scrollback
set -g mouse on
set -g history-limit 10000

# Truecolor
set -g default-terminal "xterm-256color"
set -ga terminal-overrides ",*:Tc"

##### ─────────────────────────────────────────────
#####  Floating Help Pane
##### ─────────────────────────────────────────────

bind h display-popup -E "cat $HOME/dotfiles/tmux/help.md"

##### ─────────────────────────────────────────────
#####  Clipboard Integration (Auto‑Detect)
##### ─────────────────────────────────────────────

# macOS (pbcopy)
if-shell 'command -v pbcopy >/dev/null 2>&1' \
  'set -g @clipboard-copy "pbcopy"'

# Linux X11 (xclip)
if-shell 'command -v xclip >/dev/null 2>&1' \
  'set -g @clipboard-copy "xclip -selection clipboard -in"'

# Linux Wayland (wl-copy)
if-shell 'command -v wl-copy >/dev/null 2>&1' \
  'set -g @clipboard-copy "wl-copy"'

# Fallback (tmux buffer only)
if-shell '[ -z "#{@clipboard-copy}" ]' \
  'set -g @clipboard-copy "cat > /dev/null"'

# Copy-mode integration
bind -T copy-mode-vi y send -X copy-pipe-and-cancel "#{@clipboard-copy}"

##### ─────────────────────────────────────────────
#####  Workspaces / Dashboards
##### ─────────────────────────────────────────────

# Manyfold Dashboard
bind m new-window -n manyfold 'tmux split-window -h; \
  tmux split-window -v -t 1; \
  tmux select-pane -t 0; tail -f /var/lib/manyfold/log/production.log; \
  tmux select-pane -t 2; watch -n 2 "ls -l ~/manyfold/incoming"'

# Docker Dashboard
bind d new-window -n docker 'tmux split-window -h; \
  tmux split-window -v -t 1; \
  tmux select-pane -t 0; watch -n 2 "docker ps"; \
  tmux select-pane -t 2; docker logs -f manyfold'

# 3‑pane workspace
bind w new-window -n workspace 'tmux split-window -h; \
  tmux split-window -v -t 1'


##### ─────────────────────────────────────────────
#####  Status Bar
##### ─────────────────────────────────────────────

set -g status-bg black
set -g status-fg white

set -g status-left "#[fg=green] #S "
set -g status-right "#[fg=cyan] %Y-%m-%d #[fg=yellow] %H:%M "

##### ─────────────────────────────────────────────
#####  Session Management
##### ─────────────────────────────────────────────

set -g base-index 1
setw -g pane-base-index 1

##### ─────────────────────────────────────────────
#####  Auto‑Sessions (Pro only)
##### ─────────────────────────────────────────────

if-shell '[ -f ~/dotfiles/tmux/auto-session.sh ]' \
  'run-shell ~/dotfiles/tmux/auto-session.sh'

##### ─────────────────────────────────────────────
#####  OS Detection
##### ─────────────────────────────────────────────

if-shell '[ -f ~/dotfiles/tmux/detect-os.conf ]' \
  'source-file ~/dotfiles/tmux/detect-os.conf'
