##### ------------------------------------------------------------
#####  BASIC TMUX CONFIG — CLEAN & MINIMAL
#####  Prefix: Ctrl + a (primary), Ctrl + b (secondary)
#####  Purpose:
#####    - Lightweight tmux experience
#####    - No custom layouts
#####    - No floating help popup
#####    - No project-aware sessions
##### ------------------------------------------------------------


##### ------------------------------------------------------------
#####  PREFIX KEYS
##### ------------------------------------------------------------

# Primary prefix (modern, ergonomic)
set -g prefix C-a

# Secondary prefix (classic tmux compatibility)
set-option -g prefix2 C-b


# --- Clipboard Integration (Auto‑Detect) ---

# macOS (pbcopy)
if-shell 'command -v pbcopy >/dev/null 2>&1' \
  'set -g @clipboard-copy "pbcopy"'

# Linux X11 (xclip)
if-shell 'command -v xclip >/dev/null 2>&1' \
  'set -g @clipboard-copy "xclip -selection clipboard -in"'

# Linux Wayland (wl-copy)
if-shell 'command -v wl-copy >/dev/null 2>&1' \
  'set -g @clipboard-copy "wl-copy"'

# Fallback (tmux buffer only)
if-shell '[ -z "#{@clipboard-copy}" ]' \
  'set -g @clipboard-copy "cat > /dev/null"'

# Bind y in copy-mode to copy to system clipboard
bind -T copy-mode-vi y send -X copy-pipe-and-cancel "#{@clipboard-copy}"

##### -------------------------------
##### Allow non-bracketred paste.
##### ------------------------------
set -g allow-passthrough on
set -g set-clipboard on
set -g mouse on
set -g bracketed-paste off

##### ------------------------------------------------------------
#####  GENERAL SETTINGS
##### ------------------------------------------------------------

# Enable mouse support (scrolling, pane selection, resizing)
set -g mouse on

# Increase scrollback history
set -g history-limit 5000

# Start window and pane numbering at 1 (more intuitive)
set -g base-index 1
setw -g pane-base-index 1

# Use Vim-style keys in copy mode
setw -g mode-keys vi


##### ------------------------------------------------------------
#####  STATUS BAR
##### ------------------------------------------------------------

# Simple, clean status bar
set -g status-bg black
set -g status-fg white

# Left side: session name
set -g status-left "#S"

# Right side: date + time
set -g status-right "%Y-%m-%d %H:%M"
